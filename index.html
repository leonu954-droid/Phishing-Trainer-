/* ============================================================
   Hilfsfunktionen
   ============================================================ */

function mischen(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/** Zerlegt einen Text in Segmente und markiert gefundene Merkmale. */
function segmentiere(text, merkmale) {
  const treffer = [];
  merkmale.forEach((m) => {
    if (!m.marker) return;
    const i = text.indexOf(m.marker);
    if (i === -1) return;
    treffer.push({ start: i, ende: i + m.marker.length, m });
  });
  treffer.sort((a, b) => a.start - b.start);

  const segmente = [];
  let pos = 0;
  treffer.forEach((t) => {
    if (t.start < pos) return;
    if (t.start > pos) segmente.push({ text: text.slice(pos, t.start) });
    segmente.push({ text: text.slice(t.start, t.ende), m: t.m });
    pos = t.ende;
  });

.pt-stufe { position: relative; padding-right: 44px; }
.pt-stufe-n {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  font-family: 'IBM Plex Mono', monospace; font-size: calc(11.5px * var(--skala)); color: var(--nebel);
}

/* Link-Ansicht */
.pt-kontext {
  font-size: calc(13.5px * var(--skala)); line-height: 1.55; color: var(--text-weich);
  background: rgba(var(--auf), .045); border-radius: 10px;
  padding: 12px 14px; margin: 0 0 14px;
}
.pt-kontext-label {
  display: block; font-family: 'IBM Plex Mono', monospace; font-size: calc(10.5px * var(--skala));
  letter-spacing: .12em; text-transform: uppercase; color: var(--nebel); margin-bottom: 5px;
}

.pt-url-karte {
  position: relative; overflow: hidden;
  background: var(--papier); color: var(--tinte);
  border-radius: 14px; border: 1px solid var(--papier-rand);
  box-shadow: 0 18px 40px -22px rgba(0,0,0,.8);
  padding: 20px 16px;
}
.pt-url-karte.ist-aufgedeckt::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, transparent 0%, color-mix(in srgb, var(--marker) 50%, transparent) 50%, transparent 100%);
  animation: pt-scan .7s ease-out 1;
}
.pt-url {
  font-family: 'IBM Plex Mono', monospace;
  font-size: calc(clamp(14px, 4.2vw, 17px) * var(--skala)); line-height: 2;
  word-break: break-all; user-select: all;
}
.pt-url-teil { padding: 2px 0; border-bottom: 3px solid transparent; }
.pt-url-teil.ist-warnung { border-bottom-color: var(--marker); background: color-mix(in srgb, var(--marker) 28%, transparent); }
.pt-url-teil.ist-gut { border-bottom-color: var(--marker-gut); background: color-mix(in srgb, var(--marker-gut) 24%, transparent); }
.pt-url-teil.ist-domain { font-weight: 500; }
.pt-url-nr {
  display: inline-block; margin-left: 3px; vertical-align: super;
  font-size: calc(9.5px * var(--skala)); font-weight: 500;
  background: var(--tinte); color: var(--papier);
  min-width: 14px; height: 14px; line-height: 14px; text-align: center;
  border-radius: 4px; padding: 0 3px;
}

/* Zerlegungs-Tabelle */
.pt-zerlegung { list-style: none; margin: 0 0 22px; padding: 0; display: grid; gap: 3px; }
.pt-zerlegung-zeile {
  display: flex; align-items: baseline; gap: 10px;
  padding: 7px 10px; border-radius: 7px; background: rgba(var(--auf), .04);
  border-left: 3px solid transparent;
}
.pt-zerlegung-zeile.ist-warnung { border-left-color: var(--marker); }
.pt-zerlegung-zeile.ist-gut { border-left-color: var(--marker-gut); }
.pt-zerlegung-zeile.ist-domain { background: rgba(var(--auf), .09); }
.pt-zerlegung-rolle {
  flex: 0 0 82px; font-family: 'IBM Plex Mono', monospace; font-size: calc(10.5px * var(--skala));
  letter-spacing: .07em; text-transform: uppercase; color: var(--nebel);
}
.pt-zerlegung-wert {
  flex: 1; font-family: 'IBM Plex Mono', monospace; font-size: calc(13px * var(--skala));
  word-break: break-all; color: var(--text);
}
.pt-zerlegung-badge {
  font-family: 'IBM Plex Mono', monospace; font-size: calc(9.5px * var(--skala)); letter-spacing: .08em;
  text-transform: uppercase; color: var(--tinte); background: var(--marker);
  padding: 3px 6px; border-radius: 4px; white-space: nowrap;
}

.pt-extras-hinweis {
  font-size: calc(12px * var(--skala)); line-height: 1.5; color: var(--nebel);
  margin: -8px 0 20px; padding-left: 31px;
}

/* Overlay-Tabs */
.pt-overlay-tabs { display: flex; gap: 4px; padding: 4px; background: rgba(var(--auf), .06); border-radius: 10px; }
.pt-overlay-tab {
  padding: 8px 13px; border: none; border-radius: 7px; cursor: pointer;
  background: transparent; color: var(--nebel);
  font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: calc(13.5px * var(--skala));
  transition: background .15s, color .15s;
}
.pt-overlay-tab.ist-aktiv { background: var(--text); color: var(--bg); }
.pt-lexikon-knopf.ist-notfall { border-color: color-mix(in srgb, var(--signal) 50%, transparent); }
.pt-lexikon-knopf.ist-notfall:hover { border-color: var(--signal); background: color-mix(in srgb, var(--signal) 12%, transparent); }

/* Notfall-Tab */
.pt-notfall-intro { font-size: calc(13.5px * var(--skala)); line-height: 1.6; color: var(--text-weich); margin: 0 0 16px; }
.pt-grundregeln {
  margin: 0 0 22px; padding: 13px 15px 13px 32px; border-radius: 10px;
  background: color-mix(in srgb, var(--marker) 10%, transparent); border-left: 3px solid var(--marker);
  display: grid; gap: 6px; font-size: calc(13px * var(--skala)); line-height: 1.5; color: var(--text-weich);
}

.pt-faelle { display: grid; gap: 8px; margin-bottom: 24px; }
.pt-fall { border: 1px solid rgba(var(--auf), .1); border-radius: 11px; overflow: hidden; }
.pt-fall.ist-offen { border-color: rgba(var(--auf), .2); background: rgba(var(--auf), .04); }
.pt-fall-kopf {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px 14px; background: none; border: none; cursor: pointer; color: var(--text); text-align: left;
}
.pt-fall-titel { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: calc(14.5px * var(--skala)); line-height: 1.35; }
.pt-fall-pfeil { font-size: calc(18px * var(--skala)); color: var(--nebel); line-height: 1; flex: 0 0 auto; }
.pt-fall-inhalt { padding: 0 14px 16px; animation: pt-hoch .25s ease both; }
.pt-fall-wenn { font-size: calc(13px * var(--skala)); line-height: 1.5; color: var(--nebel); margin: 0 0 14px; }
.pt-fall-label {
  font-family: 'IBM Plex Mono', monospace; font-size: calc(10.5px * var(--skala)); letter-spacing: .12em;
  text-transform: uppercase; margin: 0 0 7px;
}
.pt-fall-label.ist-tun { color: var(--gut-text); }
.pt-fall-label.ist-nicht { color: var(--signal-text); margin-top: 16px; }
.pt-fall-liste { margin: 0; padding-left: 17px; display: grid; gap: 6px; font-size: calc(13.5px * var(--skala)); line-height: 1.55; color: var(--text-weich); }
.pt-fall-liste.ist-tun li::marker { color: var(--gut-text); }
.pt-fall-liste.ist-nicht li::marker { color: var(--signal-text); }
.pt-fall-schluss {
  font-size: calc(13px * var(--skala)); line-height: 1.6; color: var(--text-weich); margin: 16px 0 0;
  padding: 11px 13px; background: rgba(var(--auf), .05); border-radius: 9px;
}

/* Anlaufstellen */
.pt-hilfe { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 11px; }
.pt-hilfe-eintrag { border-left: 2px solid var(--marker-gut); padding-left: 12px; }
.pt-hilfe-kopf { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.pt-hilfe-name { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: calc(14px * var(--skala)); }
.pt-hilfe-wert {
  font-family: 'IBM Plex Mono', monospace; font-size: calc(13px * var(--skala)); color: var(--akzent-text);
  white-space: nowrap; user-select: all;
}
.pt-hilfe-info { display: block; font-size: calc(12.5px * var(--skala)); line-height: 1.5; color: var(--text-leise); margin-top: 2px; }
.pt-hilfe-fuss { font-size: calc(11.5px * var(--skala)); line-height: 1.5; color: var(--nebel); margin: 0; }

/* Datenleck-Tab */
.pt-overlay-tabs { flex-wrap: wrap; }
.pt-sim-banner {
  font-size: calc(13px * var(--skala)); line-height: 1.55; color: var(--text-weich);
  background: color-mix(in srgb, var(--marker) 10%, transparent); border-left: 3px solid var(--marker);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 18px;
}
.pt-sim-banner strong { font-family: 'Space Grotesk', sans-serif; color: var(--marker); }

.pt-suche { display: flex; gap: 8px; margin-bottom: 14px; }
.pt-suche-feld {
  flex: 1; min-width: 0; padding: 12px 13px; border-radius: 10px;
  background: rgba(var(--auf), .06); border: 1px solid rgba(var(--auf), .14);
  color: var(--text); font-weight: 400; font-size: calc(14px * var(--skala)); font-family: 'IBM Plex Mono', monospace;
}
.pt-suche-feld::placeholder { color: rgba(141,151,180,.7); }
.pt-suche-feld:focus { outline: none; border-color: var(--marker); }
.pt-suche-knopf {
  padding: 12px 17px; border: none; border-radius: 10px; cursor: pointer;
  background: var(--marker); color: var(--tinte);
  font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: calc(14px * var(--skala));
}
.pt-suche-knopf:hover { filter: brightness(1.07); }

.pt-demo-hinweis { font-size: calc(12px * var(--skala)); color: var(--nebel); margin: 0 0 8px; }
.pt-demo-knoepfe { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.pt-demo-knopf {
  padding: 7px 10px; border-radius: 7px; cursor: pointer;
  background: rgba(var(--auf), .05); border: 1px solid rgba(var(--auf), .12);
  color: var(--text-weich); font-weight: 400; font-size: calc(11.5px * var(--skala)); font-family: 'IBM Plex Mono', monospace;
}
.pt-demo-knopf:hover { border-color: var(--nebel); color: var(--text); }

.pt-ergebnis-leer {
  font-size: calc(13px * var(--skala)); line-height: 1.55; color: var(--text-weich);
  padding: 13px 15px; background: rgba(var(--auf), .045); border-radius: 10px; margin: 0 0 22px;
}
.pt-ergebnis { margin-bottom: 24px; animation: pt-hoch .3s ease both; }
.pt-ergebnis-kopf { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.pt-ergebnis-zahl {
  font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: calc(38px * var(--skala));
  line-height: 1; letter-spacing: -.03em;
}
.pt-ergebnis-kopf.ist-treffer .pt-ergebnis-zahl { color: var(--signal); }
.pt-ergebnis-kopf.ist-sauber .pt-ergebnis-zahl { color: var(--marker-gut); }
.pt-ergebnis-text { font-size: calc(13.5px * var(--skala)); color: var(--text-weich); }
.pt-ergebnis-hinweis { font-size: calc(13px * var(--skala)); line-height: 1.55; color: var(--nebel); margin: 0 0 14px; }

.pt-leck {
  border: 1px solid rgba(var(--auf), .1); border-left-width: 3px;
  border-radius: 10px; padding: 13px 14px; margin-bottom: 9px;
}
.pt-leck.ist-hoch { border-left-color: var(--signal); }
.pt-leck.ist-mittel { border-left-color: var(--marker); }
.pt-leck.ist-niedrig { border-left-color: var(--nebel); }
.pt-leck-kopf { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.pt-leck-dienst { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: calc(15px * var(--skala)); }
.pt-leck-jahr { font-family: 'IBM Plex Mono', monospace; font-size: calc(12px * var(--skala)); color: var(--nebel); }
.pt-leck-meta { font-size: calc(12px * var(--skala)); color: var(--nebel); margin: 2px 0 10px; }
.pt-leck-daten { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.pt-leck-chip {
  font-family: 'IBM Plex Mono', monospace; font-size: calc(11px * var(--skala));
  padding: 4px 8px; border-radius: 5px;
  background: rgba(var(--auf), .07); color: var(--text-weich);
}
.pt-leck-chip.ist-kritisch { background: color-mix(in srgb, var(--signal) 18%, transparent); color: var(--signal-text); }
.pt-leck-was { font-size: calc(13px * var(--skala)); line-height: 1.55; color: var(--text-leise); margin: 0; }
.pt-leck-alarm {
  font-size: calc(13px * var(--skala)); line-height: 1.55; color: var(--signal-text); margin: 14px 0 0;
  padding: 11px 13px; background: color-mix(in srgb, var(--signal) 12%, transparent);
  border-left: 3px solid var(--signal); border-radius: 9px;
}

.pt-technik {
  list-style: none; margin: 0 0 18px; padding: 0;
  display: grid; gap: 11px; font-size: calc(13px * var(--skala)); line-height: 1.55; color: var(--text-weich);
}
.pt-technik strong { font-family: 'Space Grotesk', sans-serif; font-weight: 500; color: var(--text); }

/* Einstellungen */
.pt-zahnrad {
  display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 34px;
  border-radius: 999px; cursor: pointer; color: var(--text);
  background: none; border: 1px solid rgba(var(--auf), .18);
  transition: border-color .15s, background .15s, transform .2s;
}
.pt-zahnrad:hover {
  border-color: var(--marker);
  background: color-mix(in srgb, var(--marker) 10%, transparent);
  transform: rotate(35deg);
}

.pt-overlay-inhalt.ist-schmal { max-width: 420px; }

.pt-feld-titel {
  font-family: 'IBM Plex Mono', monospace; font-size: calc(10.5px * var(--skala));
  letter-spacing: .12em; text-transform: uppercase; color: var(--nebel);
  margin: 0 0 9px;
}

.pt-segment {
  display: flex; flex-wrap: wrap; gap: 5px; padding: 5px; margin-bottom: 22px;
  background: rgba(var(--auf), .06); border-radius: 11px;
}
.pt-segment-knopf {
  flex: 1 1 auto; padding: 10px 8px; border: none; border-radius: 8px; cursor: pointer;
  background: transparent; color: var(--nebel); white-space: nowrap;
  font-family: 'Space Grotesk', sans-serif; font-weight: 500;
  font-size: calc(13px * var(--skala));
  transition: background .15s, color .15s;
}
.pt-segment-knopf.ist-aktiv { background: var(--text); color: var(--bg); }

.pt-farben { display: flex; gap: 10px; margin-bottom: 22px; }
.pt-farbe {
  width: 38px; height: 38px; border-radius: 999px; cursor: pointer; padding: 0;
  background: var(--probe); border: 2px solid transparent;
  box-shadow: 0 0 0 1px rgba(var(--auf), .14) inset;
  transition: transform .15s, box-shadow .15s;
}
.pt-farbe:hover { transform: scale(1.07); }
.pt-farbe.ist-aktiv {
  border-color: var(--bg);
  box-shadow: 0 0 0 2px var(--text);
}

.pt-probe {
  background: var(--papier); color: var(--tinte);
  border: 1px solid var(--papier-rand); border-radius: 12px;
  padding: 14px; margin-bottom: 16px;
}
.pt-probe-label {
  font-family: 'IBM Plex Mono', monospace; font-size: calc(10px * var(--skala));
  letter-spacing: .12em; text-transform: uppercase; color: #7c7a70; margin: 0 0 7px;
}
.pt-probe-text { margin: 0; font-size: calc(14px * var(--skala)); line-height: 1.6; }

.pt-root :focus-visible { outline: 2px solid var(--marker); outline-offset: 2px; }

@media (max-width: 400px) {
  .pt-kopfzeile { flex-direction: column; gap: 1px; }
  .pt-kopfzeile-label { flex: none; }
  .pt-ranking-kat { flex: 0 0 46%; }
}

@media (prefers-reduced-motion: reduce) {
  .pt-root *, .pt-root *::before, .pt-root *::after {
    animation: none !important; transition: none !important;
  }
}
